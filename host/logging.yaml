# logging.yaml — конфигурация логирования
# Документация: https://docs.python.org/3/library/logging.config.html

version: 1
disable_existing_loggers: false

formatters:
  file_fmt:
    format: "%(asctime)s [%(levelname)-7s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  console_fmt:
    format: "%(asctime)s [%(levelname)-7s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  tui_fmt:
    format: "%(asctime)s.%(msecs)03d %(message)s"
    datefmt: "%H:%M:%S"

handlers:
  file:
    class: logging.handlers.TimedRotatingFileHandler
    filename: "./logs/app.log"
    when: "midnight"
    interval: 1
    backupCount: 30
    encoding: "utf-8"
    formatter: file_fmt

  console:
    class: logging.StreamHandler
    stream: "ext://sys.stderr"
    formatter: console_fmt

root:
  level: "INFO"
  handlers:
    - file
    # - console   # раскомментируйте, если нужен вывод в stderr по умолчанию